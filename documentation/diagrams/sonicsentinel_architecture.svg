<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1010" width="1600" height="1010" font-family="Inter, DejaVu Sans, Arial, sans-serif"><defs><marker id="m2E5A8A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2E5A8A"/></marker><marker id="mA0522D" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#A0522D"/></marker><marker id="m3E7A4A" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3E7A4A"/></marker><marker id="m9A6212" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9A6212"/></marker><marker id="m4A2C21" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4A2C21"/></marker><linearGradient id="hd" x1="0" x2="1"><stop offset="0" stop-color="#3B2016"/><stop offset="1" stop-color="#6B3E2E"/></linearGradient></defs><rect width="1600" height="1010" fill="#FFFDFB"/><rect width="1600" height="96" fill="url(#hd)"/><text x="40" y="50" font-size="30" font-weight="800" fill="#FFF3E6">SonicSentinel AI – Architecture &amp; Data Flow</text><text x="40" y="78" font-size="15" fill="#E9C9A8">Browser (TensorFlow.js)  ⇄  Flask backend (Python)  ⇄  SQLite database · two independent models, one explainable decision</text><rect x="30" y="120" width="420" height="770" rx="20" fill="#F6F9FC" stroke="#2E5A8A" stroke-width="1.4" stroke-dasharray="7 5"/><text x="52" y="154" font-size="15" font-weight="800" fill="#2E5A8A" letter-spacing="1">① BROWSER  ·  Chrome / Edge</text><rect x="660" y="120" width="450" height="770" rx="20" fill="#FCF8F5" stroke="#A0522D" stroke-width="1.4" stroke-dasharray="7 5"/><text x="682" y="154" font-size="15" font-weight="800" fill="#A0522D" letter-spacing="1">② FLASK BACKEND  ·  run.py → create_app()</text><rect x="1300" y="120" width="270" height="770" rx="20" fill="#F6FBF6" stroke="#3E7A4A" stroke-width="1.4" stroke-dasharray="7 5"/><text x="1322" y="154" font-size="15" font-weight="800" fill="#3E7A4A" letter-spacing="1">③ SQLITE DATABASE</text><rect x="50" y="176" width="380" height="118" rx="14" fill="#fff" stroke="#2E5A8A" stroke-width="1.6"/><text x="68" y="206" font-size="17" font-weight="700" fill="#4A2C21">User interface</text><rect x="348.2" y="189" width="67.80000000000001" height="22" rx="11" fill="#2E5A8A"/><text x="408" y="205" font-size="11.5" font-weight="700" fill="#fff" text-anchor="end">HTML/JS</text><text x="68" y="231" font-size="13.5" fill="#4a3d38">Jinja + Tailwind · Dashboard · Upload</text><text x="68" y="251" font-size="13.5" fill="#4a3d38">Live · Lab · History · Alerts · Review</text><text x="68" y="271" font-size="13.5" fill="#4a3d38">app.js → SS.api() fetch with CSRF token</text><rect x="50" y="318" width="380" height="110" rx="14" fill="#fff" stroke="#2E5A8A" stroke-width="1.6"/><text x="68" y="348" font-size="17" font-weight="700" fill="#4A2C21">live.js – microphone</text><text x="68" y="373" font-size="13.5" fill="#4a3d38">getUserMedia → AudioContext 44.1 kHz</text><text x="68" y="393" font-size="13.5" fill="#4a3d38">2-second windows → WAV (wav.js)</text><text x="68" y="413" font-size="13.5" fill="#4a3d38">status: Active · Paused · Permission denied</text><rect x="50" y="452" width="380" height="178" rx="14" fill="#E8F0F7" stroke="#2E5A8A" stroke-width="1.6"/><text x="68" y="482" font-size="17" font-weight="700" fill="#2E5A8A">Teachable Machine</text><rect x="348.2" y="465" width="67.80000000000001" height="22" rx="11" fill="#2E5A8A"/><text x="408" y="481" font-size="11.5" font-weight="700" fill="#fff" text-anchor="end">MODEL 2</text><text x="68" y="507" font-size="13.5" fill="#4a3d38">gtm.js · Google Teachable Machine export</text><text x="68" y="527" font-size="13.5" fill="#4a3d38">TF.js 1.3.1 + speech-commands 0.4.0</text><text x="68" y="547" font-size="13.5" fill="#4a3d38">FFT 2048 · Blackman · hop 1024</text><text x="68" y="567" font-size="13.5" fill="#4a3d38">→ 43 × 232 spectrogram per 1-s window</text><text x="68" y="587" font-size="13.5" fill="#4a3d38">→ confidence for all 10 classes</text><rect x="50" y="656" width="380" height="214" rx="14" fill="#FFF7EC" stroke="#9A6212" stroke-width="1.4"/><text x="68" y="686" font-size="16" font-weight="800" fill="#9A6212">🔒 Independence rule (SRS 1.8)</text><text x="68" y="714" font-size="14" fill="#5a4a2a">GTM runs only in the browser and</text><text x="68" y="737" font-size="14" fill="#5a4a2a">receives only audio. The Python result is</text><text x="68" y="760" font-size="14" fill="#5a4a2a">never sent to gtm.js – for live windows</text><text x="68" y="783" font-size="14" fill="#5a4a2a">GTM scores are attached BEFORE the</text><text x="68" y="806" font-size="14" fill="#5a4a2a">server sees the audio. Both models are</text><text x="68" y="829" font-size="14" fill="#5a4a2a">trained on the same TRAIN split.</text><rect x="680" y="176" width="410" height="92" rx="14" fill="#fff" stroke="#A0522D" stroke-width="1.6"/><text x="698" y="206" font-size="17" font-weight="700" fill="#4A2C21">Routes / blueprints</text><text x="698" y="231" font-size="13.5" fill="#4a3d38">auth · main · api · alerts · review · admin</text><text x="698" y="251" font-size="13.5" fill="#4a3d38">CSRF check · @roles_required · /healthz</text><rect x="680" y="290" width="410" height="112" rx="14" fill="#fff" stroke="#A0522D" stroke-width="1.6"/><text x="698" y="320" font-size="17" font-weight="700" fill="#4A2C21">Analysis service – analysis.py</text><text x="698" y="345" font-size="13.5" fill="#4a3d38">validate → SHA-256 + fingerprint duplicates</text><text x="698" y="365" font-size="13.5" fill="#4a3d38">quality: Good / Acceptable / Poor / Unusable</text><text x="698" y="385" font-size="13.5" fill="#4a3d38">mono 22 kHz · trim · denoise · 2-s segments</text><rect x="680" y="424" width="410" height="96" rx="14" fill="#F5EDE6" stroke="#A0522D" stroke-width="1.6"/><text x="698" y="454" font-size="17" font-weight="700" fill="#4A2C21">Python model – XGBoost</text><rect x="1008.2" y="437" width="67.80000000000001" height="22" rx="11" fill="#A0522D"/><text x="1068" y="453" font-size="11.5" font-weight="700" fill="#fff" text-anchor="end">MODEL 1</text><text x="698" y="479" font-size="13.5" fill="#4a3d38">299 features (MFCC, Mel, chroma, spectral, onset)</text><text x="698" y="499" font-size="13.5" fill="#4a3d38">py-xgb-20260925-0316 · test acc 0.873</text><rect x="680" y="542" width="410" height="152" rx="14" fill="#fff" stroke="#A0522D" stroke-width="1.6"/><text x="698" y="572" font-size="17" font-weight="700" fill="#4A2C21">Decision engine</text><rect x="993.4" y="555" width="82.60000000000001" height="22" rx="11" fill="#A0522D"/><text x="1068" y="571" font-size="11.5" font-weight="700" fill="#fff" text-anchor="end">EXPLAINED</text><text x="698" y="597" font-size="13.5" fill="#4a3d38">decision.py + rules.py · compare models</text><text x="698" y="617" font-size="13.5" fill="#4a3d38">combine: 0.7 · Python + 0.3 · GTM</text><text x="698" y="637" font-size="13.5" fill="#4a3d38">Unknown · overlap · repeat confirmation</text><text x="698" y="657" font-size="13.5" fill="#4a3d38">alert rules (severity) · look-alike check</text><text x="698" y="677" font-size="13.5" fill="#4a3d38">→ alert  /  manual review  /  classified</text><rect x="680" y="716" width="410" height="154" rx="14" fill="#fff" stroke="#A0522D" stroke-width="1.6"/><text x="698" y="746" font-size="17" font-weight="700" fill="#4A2C21">Supporting services</text><text x="698" y="771" font-size="13.5" fill="#4a3d38">Explainable AI – TreeSHAP explanations</text><text x="698" y="791" font-size="13.5" fill="#4a3d38">Alerts (acknowledge / escalate / dismiss)</text><text x="698" y="811" font-size="13.5" fill="#4a3d38">Manual review · audit trail · notifications</text><text x="698" y="831" font-size="13.5" fill="#4a3d38">Analytics · CSV/Excel export · retention</text><line x1="885" y1="268" x2="885" y2="282" stroke="#A0522D" stroke-width="2.2" marker-end="url(#mA0522D)"/><line x1="885" y1="402" x2="885" y2="416" stroke="#A0522D" stroke-width="2.2" marker-end="url(#mA0522D)"/><line x1="885" y1="520" x2="885" y2="534" stroke="#A0522D" stroke-width="2.2" marker-end="url(#mA0522D)"/><line x1="885" y1="694" x2="885" y2="708" stroke="#A0522D" stroke-width="2.2" marker-end="url(#mA0522D)"/><rect x="1320" y="176" width="230" height="330" rx="14" fill="#fff" stroke="#3E7A4A" stroke-width="1.6"/><text x="1338" y="206" font-size="17" font-weight="700" fill="#3E7A4A">Tables (SQLAlchemy)</text><text x="1338" y="231" font-size="13.5" fill="#4a3d38">users · live_sessions</text><text x="1338" y="251" font-size="13.5" fill="#4a3d38">audio_events</text><text x="1338" y="271" font-size="13.5" fill="#4a3d38">segments</text><text x="1338" y="291" font-size="13.5" fill="#4a3d38">alerts · alert_actions</text><text x="1338" y="311" font-size="13.5" fill="#4a3d38">reviews</text><text x="1338" y="331" font-size="13.5" fill="#4a3d38">audit_logs</text><text x="1338" y="351" font-size="13.5" fill="#4a3d38">system_notifications</text><text x="1338" y="371" font-size="13.5" fill="#4a3d38">settings · model_versions</text><text x="1338" y="391" font-size="13.5" fill="#4a3d38"></text><text x="1338" y="411" font-size="13.5" fill="#4a3d38">11 tables in sonicsentinel.db</text><rect x="1320" y="530" width="230" height="160" rx="14" fill="#fff" stroke="#3E7A4A" stroke-width="1.6"/><text x="1338" y="560" font-size="17" font-weight="700" fill="#3E7A4A">Files – data/</text><text x="1338" y="585" font-size="13.5" fill="#4a3d38">uploads/  original audio</text><text x="1338" y="605" font-size="13.5" fill="#4a3d38">segments/<audio_id>/</text><text x="1338" y="625" font-size="13.5" fill="#4a3d38">   seg_NNN.wav (44.1 kHz)</text><text x="1338" y="645" font-size="13.5" fill="#4a3d38">images/  waveform, Mel,</text><text x="1338" y="665" font-size="13.5" fill="#4a3d38">   explain PNG</text><rect x="1320" y="712" width="230" height="158" rx="14" fill="#fff" stroke="#3E7A4A" stroke-width="1.6"/><text x="1338" y="742" font-size="17" font-weight="700" fill="#3E7A4A">Model &amp; config files</text><text x="1338" y="767" font-size="13.5" fill="#4a3d38">sonic_model.joblib</text><text x="1338" y="787" font-size="13.5" fill="#4a3d38">gtm_model/model/</text><text x="1338" y="807" font-size="13.5" fill="#4a3d38">alert_rules.json</text><text x="1338" y="827" font-size="13.5" fill="#4a3d38">(read at start-up)</text><line x1="432" y1="212" x2="668" y2="212" stroke="#2E5A8A" stroke-width="2.6" marker-end="url(#m2E5A8A)"/><circle cx="448" cy="212" r="12" fill="#2E5A8A"/><text x="448" y="216.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="563.0" y="202" font-size="12.5" font-weight="700" fill="#2E5A8A" text-anchor="middle">POST /api/upload</text><text x="563.0" y="234" font-size="12" fill="#6b5e58" text-anchor="middle">audio file</text><line x1="678" y1="302" x2="442" y2="302" stroke="#A0522D" stroke-width="2.6" marker-end="url(#mA0522D)"/><circle cx="662" cy="302" r="12" fill="#A0522D"/><text x="662" y="306.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="563.0" y="292" font-size="12.5" font-weight="700" fill="#A0522D" text-anchor="middle">result + alerts</text><text x="563.0" y="324" font-size="12" fill="#6b5e58" text-anchor="middle">JSON · toasts</text><line x1="432" y1="372" x2="668" y2="372" stroke="#2E5A8A" stroke-width="2.6" marker-end="url(#m2E5A8A)"/><circle cx="448" cy="372" r="12" fill="#2E5A8A"/><text x="448" y="376.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">L</text><text x="563.0" y="362" font-size="12.5" font-weight="700" fill="#2E5A8A" text-anchor="middle">POST /api/live/window</text><text x="563.0" y="394" font-size="12" fill="#6b5e58" text-anchor="middle">WAV + GTM scores</text><line x1="678" y1="488" x2="442" y2="488" stroke="#A0522D" stroke-width="2.6" marker-end="url(#mA0522D)"/><circle cx="662" cy="488" r="12" fill="#A0522D"/><text x="662" y="492.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="563.0" y="478" font-size="12.5" font-weight="700" fill="#A0522D" text-anchor="middle">GET /media/segment</text><text x="563.0" y="510" font-size="12" fill="#6b5e58" text-anchor="middle">2-s WAV segments</text><line x1="432" y1="572" x2="668" y2="572" stroke="#2E5A8A" stroke-width="2.6" marker-end="url(#m2E5A8A)"/><circle cx="448" cy="572" r="12" fill="#2E5A8A"/><text x="448" y="576.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="563.0" y="562" font-size="12.5" font-weight="700" fill="#2E5A8A" text-anchor="middle">POST …/events/&lt;id&gt;/gtm</text><text x="563.0" y="594" font-size="12" fill="#6b5e58" text-anchor="middle">GTM scores (JSON)</text><line x1="1092" y1="340" x2="1308" y2="340" stroke="#3E7A4A" stroke-width="2.6" marker-end="url(#m3E7A4A)"/><circle cx="1108" cy="340" r="12" fill="#3E7A4A"/><text x="1108" y="344.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="1213.0" y="330" font-size="12.5" font-weight="700" fill="#3E7A4A" text-anchor="middle">INSERT event</text><text x="1213.0" y="362" font-size="12" fill="#6b5e58" text-anchor="middle">segments · pending</text><line x1="1092" y1="610" x2="1308" y2="610" stroke="#3E7A4A" stroke-width="2.6" marker-end="url(#m3E7A4A)"/><circle cx="1108" cy="610" r="12" fill="#3E7A4A"/><text x="1108" y="614.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="1213.0" y="600" font-size="12.5" font-weight="700" fill="#3E7A4A" text-anchor="middle">UPDATE decision</text><text x="1213.0" y="632" font-size="12" fill="#6b5e58" text-anchor="middle">alert · audit log</text><line x1="1318" y1="790" x2="1102" y2="790" stroke="#3E7A4A" stroke-width="2.6" marker-end="url(#m3E7A4A)"/><circle cx="1302" cy="790" r="12" fill="#3E7A4A"/><text x="1302" y="794.5" font-size="12.5" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="1213.0" y="780" font-size="12.5" font-weight="700" fill="#3E7A4A" text-anchor="middle">SELECT</text><text x="1213.0" y="812" font-size="12" fill="#6b5e58" text-anchor="middle">history · reports</text><text x="40" y="928" font-size="14" font-weight="800" fill="#4A2C21" letter-spacing="1">PIPELINE FOR EVERY RECORDING</text><rect x="40" y="944" width="140" height="40" rx="20" fill="#fff" stroke="#A0522D" stroke-width="1.4"/><text x="110.0" y="969" font-size="13.5" font-weight="700" fill="#4A2C21" text-anchor="middle">Validate</text><text x="187" y="970" font-size="16" fill="#A0522D" text-anchor="middle">›</text><rect x="194" y="944" width="140" height="40" rx="20" fill="#fff" stroke="#A0522D" stroke-width="1.4"/><text x="264.0" y="969" font-size="13.5" font-weight="700" fill="#4A2C21" text-anchor="middle">Duplicate</text><text x="341" y="970" font-size="16" fill="#A0522D" text-anchor="middle">›</text><rect x="348" y="944" width="140" height="40" rx="20" fill="#fff" stroke="#A0522D" stroke-width="1.4"/><text x="418.0" y="969" font-size="13.5" font-weight="700" fill="#4A2C21" text-anchor="middle">Quality</text><text x="495" y="970" font-size="16" fill="#A0522D" text-anchor="middle">›</text><rect x="502" y="944" width="140" height="40" rx="20" fill="#fff" stroke="#A0522D" stroke-width="1.4"/><text x="572.0" y="969" font-size="13.5" font-weight="700" fill="#4A2C21" text-anchor="middle">Pre-process</text><text x="649" y="970" font-size="16" fill="#A0522D" text-anchor="middle">›</text><rect x="656" y="944" width="140" height="40" rx="20" fill="#fff" stroke="#A0522D" stroke-width="1.4"/><text x="726.0" y="969" font-size="13.5" font-weight="700" fill="#4A2C21" text-anchor="middle">Segment</text><text x="803" y="970" font-size="16" fill="#A0522D" text-anchor="middle">›</text><rect x="810" y="944" width="140" height="40" rx="20" fill="#F5EDE6" stroke="#A0522D" stroke-width="1.4"/><text x="880.0" y="969" font-size="13.5" font-weight="700" fill="#4A2C21" text-anchor="middle">Python model</text><text x="957" y="970" font-size="16" fill="#A0522D" text-anchor="middle">›</text><rect x="964" y="944" width="140" height="40" rx="20" fill="#E8F0F7" stroke="#2E5A8A" stroke-width="1.4"/><text x="1034.0" y="969" font-size="13.5" font-weight="700" fill="#2E5A8A" text-anchor="middle">GTM (browser)</text><text x="1111" y="970" font-size="16" fill="#A0522D" text-anchor="middle">›</text><rect x="1118" y="944" width="140" height="40" rx="20" fill="#fff" stroke="#A0522D" stroke-width="1.4"/><text x="1188.0" y="969" font-size="13.5" font-weight="700" fill="#4A2C21" text-anchor="middle">Compare</text><text x="1265" y="970" font-size="16" fill="#A0522D" text-anchor="middle">›</text><rect x="1272" y="944" width="140" height="40" rx="20" fill="#F5EDE6" stroke="#A0522D" stroke-width="1.4"/><text x="1342.0" y="969" font-size="13.5" font-weight="700" fill="#4A2C21" text-anchor="middle">Decide</text><text x="1419" y="970" font-size="16" fill="#A0522D" text-anchor="middle">›</text><rect x="1426" y="944" width="140" height="40" rx="20" fill="#fff" stroke="#A0522D" stroke-width="1.4"/><text x="1496.0" y="969" font-size="13.5" font-weight="700" fill="#4A2C21" text-anchor="middle">Store &amp; alert</text></svg>